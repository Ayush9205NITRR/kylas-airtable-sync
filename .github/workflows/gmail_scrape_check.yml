name: Gmail Scraper - Check Setup

# Read-only pre-flight: verifies the secrets, the Airtable schema, the search
# terms and Gmail auth. Writes nothing anywhere. Run this first.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r gmail_scraper/requirements.txt

      - name: Pre-flight check
        run: python -m gmail_scraper.doctor
        env:
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_CLIENT_ID:         ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET:     ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN:     ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AIRTABLE_PAT:            ${{ secrets.AIRTABLE_PAT }}
          GMAIL_AIRTABLE_BASE_ID:  ${{ secrets.GMAIL_AIRTABLE_BASE_ID }}
