name: Map LinkedIn Posts CSV -> Airtable (run on demand)
# Fills Airtable "Boolean (linked)" / "Offsite Timeline (linked)" from data/linkedin_posts_mapping.csv

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no writes)'
        type: boolean
        default: true
      view:
        description: 'Optional: only map records in this Airtable view'
        required: false
        default: ''

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mapping
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/map_linkedin_posts.py $ARGS --view "$VIEW"
        env:
          AIRTABLE_PAT:             ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_COMPANY_BASE_ID: ${{ secrets.AIRTABLE_COMPANY_BASE_ID }}
          VIEW:                     ${{ github.event.inputs.view }}

      - name: Upload mapped / not mapped report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-posts-mapping-report
          path: data/linkedin_posts_mapping_report.csv
          if-no-files-found: ignore
