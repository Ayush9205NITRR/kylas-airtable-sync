name: Sync - 6:30 PM IST

on:
  schedule:
    # 6:30 PM IST = 13:00 UTC, Mon–Fri
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Fetch all records (no time filter)'
        required: false
        default: 'false'
      since_date:
        description: 'Fetch records updated on/after this date (YYYY-MM-DD). Overrides full_sync.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    # 30 is ~2x the measured cost of a healthy run (sync ~14 min + rollup a few
    # minutes). It used to be 60 because the rollup could not finish; now that
    # it can, a job creeping past 30 means something regressed, and the cap
    # stops that regression from quietly eating the month's Actions minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync team from Kylas
        # Refresh only: sync_team.yml already updates config/team.json on its
        # own daily schedule, so the committed copy is at most hours stale and
        # the sync below reads it happily either way. Never fail the run on
        # this — a transient Kylas blip here aborted the entire 6:30 PM sync,
        # emails included, on 2026-08-17 (exit 2, 22s in, before any real work).
        continue-on-error: true
        run: python scripts/sync_team.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}

      - name: Run sync
        run: |
          ARGS="--slot=full_day"
          if [ -n "${{ github.event.inputs.since_date }}" ]; then
            ARGS="$ARGS --since=${{ github.event.inputs.since_date }}"
          elif [ "${{ github.event.inputs.full_sync }}" = "true" ]; then
            ARGS="$ARGS --full-sync"
          fi
          python run_sync.py $ARGS
        env:
          KYLAS_API_KEY:            ${{ secrets.KYLAS_API_KEY }}
          AIRTABLE_PAT:             ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID:         ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_COMPANY_BASE_ID: ${{ secrets.AIRTABLE_COMPANY_BASE_ID }}
          SMTP_USER:                ${{ secrets.SMTP_USER }}
          SMTP_PASS:                ${{ secrets.SMTP_PASS }}

      - name: EOD call notes (Kylas deal Notes)
        # Summarises the day's calls into each deal's Notes section: which rep,
        # IST time, outcome, duration. Reads the call logs the reps log
        # themselves, so createdBy carries the real caller — writing call logs
        # here instead would stamp them all with the API key's user.
        #
        # Idempotent by a [calls YYYY-MM-DD] marker checked against one notes
        # sweep, so re-dispatching this workflow will not double-post. If that
        # sweep fails it writes nothing rather than risk duplicates.
        #
        # continue-on-error because this is a summary of work already done: it
        # must never take down the sync or the BD emails above it. Capped well
        # under the job timeout for the same reason.
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/eod_call_notes.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}

      - name: Rollup Offsite Timeline (Contact → Company)
        # Secondary enrichment: never fail the run if this hiccups (rate limits,
        # timeout) — the sync + email above have already completed.
        continue-on-error: true
        # Must be LESS than the job's timeout-minutes. continue-on-error only
        # forgives a *step* failure; a *job* timeout kills the job outright and
        # marks the whole run cancelled.
        #
        # This was 45 and hit that cap every single weekday, because the script
        # made 2 + N_contacts Kylas calls per company and could not get through
        # the Company List in time — 45 of the job's 60 minutes, ~1,200 Actions
        # minutes a month, spent on work that never completed. The script now
        # bulk-prefetches contacts and companies in two sweeps, so a healthy
        # run is minutes. 15 leaves generous headroom while capping the damage
        # if that ever regresses.
        timeout-minutes: 15
        run: |
          python scripts/rollup_offsite_timeline.py \
            --company-field "Offsite Timeline (BD - New)" \
            --company-cf-key "cfOffsiteTimelineBdNew"
        env:
          KYLAS_API_KEY:            ${{ secrets.KYLAS_API_KEY }}
          AIRTABLE_PAT:             ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID:         ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_COMPANY_BASE_ID: ${{ secrets.AIRTABLE_COMPANY_BASE_ID }}
