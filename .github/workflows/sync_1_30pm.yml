name: Sync - 1:30 PM IST

on:
  # Scheduling is owned by cron-job.org's "BD + Hot Pipeline" job (fires
  # workflow_dispatch at exactly 08:00 UTC / 1:30 PM IST). No native
  # `schedule:` here — GitHub's cron drifts late and was firing a SECOND
  # run (and a second email to the whole team) a few minutes after
  # cron-job.org's on-time one.
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Fetch all records (no time filter)'
        required: false
        default: 'false'
      since_date:
        description: 'Fetch records updated on/after this date (YYYY-MM-DD). Overrides full_sync.'
        required: false
        default: ''
      probe_members:
        description: 'Diagnostic: print the resolved BD member list (Airtable BD Members + team.json merge) and exit. Read-only, no sync/email runs.'
        type: boolean
        required: false
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe resolved BD member list
        if: ${{ github.event.inputs.probe_members == 'true' }}
        run: python modules/04_email_alert.py --list-members
        env:
          AIRTABLE_PAT:             ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID:         ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_COMPANY_BASE_ID: ${{ secrets.AIRTABLE_COMPANY_BASE_ID }}

      - name: Sync team from Kylas
        if: ${{ github.event.inputs.probe_members != 'true' }}
        # Refresh only — see the identical step in sync_6_00pm.yml. A Kylas
        # hiccup here must not take the sync and its emails down with it.
        continue-on-error: true
        run: python scripts/sync_team.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}

      - name: Run sync
        if: ${{ github.event.inputs.probe_members != 'true' }}
        run: |
          ARGS="--slot=first_half"
          if [ -n "${{ github.event.inputs.since_date }}" ]; then
            ARGS="$ARGS --since=${{ github.event.inputs.since_date }}"
          elif [ "${{ github.event.inputs.full_sync }}" = "true" ]; then
            ARGS="$ARGS --full-sync"
          fi
          python run_sync.py $ARGS
        env:
          KYLAS_API_KEY:            ${{ secrets.KYLAS_API_KEY }}
          AIRTABLE_PAT:             ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID:         ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_COMPANY_BASE_ID: ${{ secrets.AIRTABLE_COMPANY_BASE_ID }}
          SMTP_USER:                ${{ secrets.SMTP_USER }}
          SMTP_PASS:                ${{ secrets.SMTP_PASS }}

      - name: Commit Account Health snapshot
        # The runner is ephemeral: without this, state/account_health.json is
        # discarded at the end of the job, every run looks like a first run, and
        # nothing is ever tracked. git is the system of record for account
        # health history -- Airtable only mirrors the counters.
        #
        # continue-on-error because the Airtable push has already landed by this
        # point; losing one snapshot commit costs a day of change granularity,
        # never the sync itself. The pull --rebase retry handles two syncs
        # racing each other to push.
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/account_health.json
          if git diff --staged --quiet; then
            echo "account health snapshot unchanged - nothing to commit"
          else
            git commit -m "Account Health snapshot $(date -u +%F) [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
                echo "snapshot pushed"; break
              fi
              echo "push failed (attempt $i) - retrying"; sleep $((i * 5))
            done
          fi
