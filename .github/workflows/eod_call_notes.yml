name: EOD Call Notes (Kylas deal Notes)

# Writes each deal's calls for the day into its Kylas Notes section.
#
# Extracted from sync_6_00pm.yml on 2026-10-15. It used to be a step inside
# that workflow, which is now paused along with the rest of the Kylas
# pipeline -- but this is one of the two jobs that stays on, so it needs to
# stand on its own. It touches no Airtable table and needs no sync to have
# run first: it reads call logs from Kylas and writes Kylas notes.
#
# GitHub cron rather than cron-job.org, deliberately: the point of pausing
# the pipeline was to stop juggling cron-job.org jobs, and this one tolerates
# GitHub's ~2h drift. 13:00 UTC is the slot it already occupied inside the
# EOD sync; even two hours late it is still the same UTC day, so the date it
# summarises does not change.
#
# Idempotent by a [calls YYYY-MM-DD] marker checked against one notes sweep,
# so running it twice (or re-dispatching sync_6_00pm by hand, which still
# contains the original step) will not double-post.

on:
  schedule:
    - cron: '0 13 * * 1-6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would be written, write nothing'
        type: boolean
        required: false
        default: false
      date:
        description: 'Optional YYYY-MM-DD to summarise instead of today'
        required: false
        default: ''

jobs:
  eod-call-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write the day's calls into deal Notes
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          python scripts/eod_call_notes.py $ARGS
