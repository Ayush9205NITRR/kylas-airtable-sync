name: Inspect Kylas Raw Fields

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    # 5 was fine for the field dump alone. The full EOD dry run sweeps every
    # deal and reads call logs for the open ones, so it needs real headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dump raw Kylas fields
        run: python scripts/inspect_kylas.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}

      # The call-log and recency probes that lived here are gone: they answered
      # their questions and are recorded in the commit history and in
      # eod_call_notes.py's docstring. Two of them wrote to production.

      # WRITES REAL NOTES for each IST date in BACKFILL_DATES (space separated).
      # Empty = disarmed, which is how it should be left between backfills.
      #
      # Idempotent by the [calls <date>] marker, so re-dispatching is safe: a
      # deal that already carries the day's note is skipped. That cuts both
      # ways — a deal noted from the pre-2026-08-22 read carries an INCOMPLETE
      # note and will be skipped rather than corrected, because the marker
      # cannot tell a short read from a quiet day. Deals 4436857 and 4443457
      # are in that state for 2026-08-21.
      #
      # Verified on run 32555064819 (dry run, 2026-08-19): 100 call logs read,
      # 21 on the day, 6 deals — including 4676048, the deal whose missing note
      # started this. The same date returned nothing at all before the read was
      # sized.
      - name: EOD call notes backfill (WRITES to production)
        if: always()
        run: |
          if [ -z "$BACKFILL_DATES" ]; then
            echo "BACKFILL_DATES empty — skipping."; exit 0
          fi
          rc=0
          for d in $BACKFILL_DATES; do
            echo "=============== $d ==============="
            # Keep going if one date fails: the days are independent, and a
            # transient failure on one should not cost the others.
            python scripts/eod_call_notes.py --date "$d" || rc=1
          done
          exit $rc
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
          BACKFILL_DATES: "2026-08-19 2026-08-20 2026-08-21"
