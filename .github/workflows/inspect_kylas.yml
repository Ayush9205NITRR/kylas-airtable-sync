name: Inspect Kylas Raw Fields

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    # 5 was fine for the field dump alone. The full EOD dry run sweeps every
    # deal and reads call logs for the open ones, so it needs real headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dump raw Kylas fields
        run: python scripts/inspect_kylas.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}

      # The call-log and recency probes that lived here are gone: they answered
      # their questions and are recorded in the commit history and in
      # eod_call_notes.py's docstring. Two of them wrote to production.

      - name: EOD note format (DRY RUN — writes nothing)
        # --deal skips the sweep, so this is a couple of API calls. Dated
        # 2026-08-21 IST deliberately: that day's calls include Hrithik
        # Rawat's real one, so the output shows genuine rep attribution
        # rather than the two admin-key test records from later that night.
        if: always()
        run: |
          python scripts/eod_call_notes.py \
            --deal 4383813 --date 2026-08-21 --dry-run
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}

      - name: EOD full sweep cost (DRY RUN — writes nothing)
        # Answers the only open question before this can be scheduled: how many
        # open deals there are, and therefore how many Actions minutes a daily
        # run would cost. The script prints the true open-deal count and its
        # estimate BEFORE --max-deals caps the actual scanning, so the number is
        # real even though only a sample is scanned here.
        if: always()
        run: python scripts/eod_call_notes.py --dry-run --max-deals 60
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
