name: Inspect Kylas Raw Fields

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dump raw Kylas fields
        run: python scripts/inspect_kylas.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}

      - name: Call-log attribution test (WRITES to production)
        # Deliberately inert: TEST_DEAL_ID is empty, so the script prints
        # "refusing to write" and exits 0. It only fires once a specific deal
        # id — nominated by the repo owner — is filled in below, because the
        # Kylas public API documents no DELETE for call logs and the record it
        # creates is likely permanent.
        if: always()
        run: python scripts/test_call_log_write.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
          TEST_DEAL_ID: ""   # disarmed: call log 43843294 already created

      - name: Probe call-log OWNER assignment
        # Can one admin key set the caller? PATCHes the existing test call log
        # (recordActions.update was true) with each plausible owner shape.
        # Creates nothing. 74759 = Hrithik Rawat, seen as createdBy on a real
        # deal, so a successful patch shows up as a name in the UI.
        if: always()
        run: python scripts/probe_call_log_owner.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
          CALL_LOG_ID: "43843294"
          TEST_DEAL_ID: "4383813"
          TARGET_USER_ID: "74759"

      - name: Probe call-log READ shapes
        if: always()
        run: python scripts/probe_call_log_read.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
          CALL_LOG_ID: "43843294"
          TEST_DEAL_ID: "4383813"

