name: Inspect Kylas Raw Fields

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dump raw Kylas fields
        run: python scripts/inspect_kylas.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}

      # The call-log probes that lived here have been removed: they answered
      # their questions (call logs live at /v1/call-logs/, reads work via
      # entityId/entityType, and attribution cannot be reassigned) and two of
      # them wrote to production. utils/kylas_client.create_call_log carries
      # those findings now, and tests/test_call_log.py pins them.

      - name: Probe call recency
        # Read-only. Decides how the EOD note finds deals with calls today:
        # if a call bumps the deal's updatedAt, "deals updated today" is a
        # cheap candidate set; if not, per-deal sweeps would be an N+1.
        if: always()
        run: python scripts/probe_call_recency.py
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
          PROBE_DEAL_ID: "4383813"

      # Sample run. Writes ONE real call log to deal 4383813 — the deal already
      # nominated for testing, so nothing clean gets polluted — then lists the
      # deal's calls back. Set SAMPLE_DEAL_ID to "" to disarm.
      - name: Sample call log
        if: always()
        run: |
          if [ -z "$SAMPLE_DEAL_ID" ]; then
            echo "SAMPLE_DEAL_ID empty — skipping."; exit 0
          fi
          python scripts/log_call.py \
            --deal "$SAMPLE_DEAL_ID" \
            --by "Hritik" \
            --duration 270 \
            --outcome connected \
            --note "SAMPLE RUN — Nov offsite discussed, POC asked for the pricing deck. Not a real call."
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
          # Disarmed after run 32524198309 created call log 43843303. Do not
          # re-arm casually: the sample surfaced that reps already log their
          # own calls in Kylas with correct attribution, so anything written
          # here lands next to real data stamped "Enout Super Admin".
          SAMPLE_DEAL_ID: ""

