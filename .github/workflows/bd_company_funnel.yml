name: BD Company Funnel

# Per BD associate per month, counted in COMPANIES rather than contacts.
# Creates/refreshes the "BD Company Funnel" Airtable table.
#
# Daily rather than monthly on purpose: the current month's counts move every
# day as reps work accounts, and a month-end-only run would leave the live month
# stale for 30 days. Closed months are recomputed too and simply land on the same
# numbers, so re-running is always safe.

on:
  # Un-retired 2026-09-14. It was taken off schedule on 09-05 as redundant with
  # "BD Metrics Daily" (bd_metrics_long.yml), which carries the same six
  # Company-group metrics — but only in long form, one row per metric. This
  # table is the wide shape: one row per associate per month with all six as
  # columns, which is what the monthly view is actually read from. Retiring it
  # left that view frozen at 09-05 for nine days.
  #
  # Daily rather than monthly on purpose: the current month's counts move every
  # day, and only the CURRENT month is ever rewritten (push_to_airtable freezes
  # any closed month), so a daily run keeps the live month honest and cannot
  # retroactively shrink a finished one.
  #
  # 15:00 UTC / 20:30 IST: after the evening sync chain, so it sweeps contacts
  # that already reflect the day's work. GitHub cron rather than cron-job.org
  # because monthly grain tolerates the ~2h drift that forced the digest jobs
  # off it.
  schedule:
    - cron: '0 15 * * 1-6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the table only, write nothing to Airtable'
        type: boolean
        required: false
        default: false

jobs:
  funnel:
    runs-on: ubuntu-latest
    # A full contact sweep is ~16 min; 30 leaves headroom without letting a
    # regression quietly burn Actions minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the funnel
        run: |
          # --skip-daily: only the MONTHLY table is wanted here. The daily-grain
          # companion ("BD Company Funnel Daily") duplicates what BD Metrics
          # Daily already stores per day, and at 400-day retention it settles
          # around 5k rows — real weight against a base that sits at ~86% of its
          # 50k cap. Re-enabling this workflow on 2026-09-14 created it and
          # wrote 806 rows before this flag was added.
          ARGS="--skip-daily"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/bd_company_funnel.py $ARGS
        env:
          KYLAS_API_KEY:    ${{ secrets.KYLAS_API_KEY }}
          AIRTABLE_PAT:     ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
