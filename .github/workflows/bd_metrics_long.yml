name: BD Metrics Daily (long form)

# Writes "BD Metrics Daily" — one row per associate per day per metric, so a
# chart can put metric NAMES on the X-axis. The wide funnel tables cannot do
# that: a chart plots the values of ONE column, and there each metric is its own
# column.
#
# Also sends the ONE daily team-wide digest email (all reps in one table,
# sorted by SQL this month, highest first), replacing the old per-person
# 1:30pm/6:30pm emails from modules/04_email_alert.py — that module still
# exists and is still callable, it is just no longer invoked from run_sync.py.
#
# Scheduled for evening (after the day's calling) rather than the old
# noon-ish slot, so the digest reflects a day that is actually mostly done
# rather than half-finished.

on:
  schedule:
    - cron: '30 13 * * *'      # 7:00 PM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print a summary only, write nothing to Airtable, send no email'
        type: boolean
        required: false
        default: false
      no_email:
        description: 'Update Airtable, skip the team digest email'
        type: boolean
        required: false
        default: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the long-form metrics and send the team digest
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          elif [ "${{ github.event.inputs.no_email }}" = "true" ]; then
            ARGS="--no-email"
          fi
          python scripts/bd_metrics_long.py $ARGS
        env:
          KYLAS_API_KEY:    ${{ secrets.KYLAS_API_KEY }}
          AIRTABLE_PAT:     ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
