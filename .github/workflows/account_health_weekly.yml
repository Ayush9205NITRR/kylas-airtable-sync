name: Account Health — Weekly Digest

on:
  schedule:
    # Every Monday 8:00 AM IST = 02:30 UTC
    - cron: '30 2 * * 1'
  workflow_dispatch:
    inputs:
      no_email:
        description: 'Update Airtable only, skip email'
        required: false
        default: 'false'

jobs:
  account-health:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run account health
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.no_email }}" = "true" ]; then
            ARGS="--no-email"
          fi
          python modules/06_account_health.py $ARGS
        env:
          KYLAS_API_KEY:            ${{ secrets.KYLAS_API_KEY }}
          AIRTABLE_PAT:             ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID:         ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_COMPANY_BASE_ID: ${{ secrets.AIRTABLE_COMPANY_BASE_ID }}
          SMTP_USER:                ${{ secrets.SMTP_USER }}
          SMTP_PASS:                ${{ secrets.SMTP_PASS }}

      - name: Commit Account Health snapshot
        # The runner is ephemeral: without this, state/account_health.json is
        # discarded at the end of the job, every run looks like a first run, and
        # nothing is ever tracked. git is the system of record for account
        # health history -- Airtable only mirrors the counters.
        #
        # continue-on-error because the Airtable push has already landed by this
        # point; losing one snapshot commit costs a day of change granularity,
        # never the sync itself. The pull --rebase retry handles two syncs
        # racing each other to push.
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/account_health.json
          if git diff --staged --quiet; then
            echo "account health snapshot unchanged - nothing to commit"
          else
            git commit -m "Account Health snapshot $(date -u +%F) [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
                echo "snapshot pushed"; break
              fi
              echo "push failed (attempt $i) - retrying"; sleep $((i * 5))
            done
          fi
