name: Probe — deal owners by Kylas team

# Read-only. Two modes:
#   rotting   — only the deals the Deal Rotting alert fires on
#   all_deals — EVERY deal, open and closed, every stage. A deal parked with
#               the wrong team is a misassignment whether or not it is closed,
#               and the rot alert's stage allow-list hides most of them.
#
# Exists because "deals assigned to non-revenue folks" has no stored
# definition: team.json's revenue_team key is empty and nothing reads it. The
# split comes from Kylas team membership instead — the same signal
# sync_team.py uses for Demand Generation — with the revenue team named by
# input so it is visible rather than buried in code.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'all_deals = every deal open AND closed; rotting = only what the alert fires on'
        type: choice
        options: [all_deals, rotting]
        default: all_deals
      non_revenue_only:
        description: 'Keep only deals whose owner is NOT on the revenue team'
        type: boolean
        default: true
      revenue_team:
        description: 'Kylas team name that counts as revenue'
        required: false
        default: 'Revenue'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List deals by owner team
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
        run: |
          mkdir -p out
          ARGS="--csv out/deals_by_owner_team.csv"
          ARGS="$ARGS --revenue-team '${{ github.event.inputs.revenue_team || 'Revenue' }}'"
          if [ "${{ github.event.inputs.scope }}" != "rotting" ]; then
            ARGS="$ARGS --all-deals"
          fi
          if [ "${{ github.event.inputs.non_revenue_only }}" != "false" ]; then
            ARGS="$ARGS --non-revenue-only"
          fi
          ARGS="$ARGS --print-csv"
          eval python scripts/probe_deal_owner_teams.py $ARGS

      - name: Upload the CSV
        uses: actions/upload-artifact@v4
        with:
          name: deals-by-owner-team
          path: out/*.csv
          if-no-files-found: error
