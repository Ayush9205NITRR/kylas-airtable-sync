name: BD Monthly Report

on:
  # Scheduling is owned by cron-job.org's "BD Monthly" job (fires
  # workflow_dispatch at exactly 03:30 UTC / 9:00 AM IST on the 1st). No
  # native `schedule:` here — GitHub's cron drifts late and was firing a
  # SECOND run (and a second email to the whole team) after cron-job.org's
  # on-time one.
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send monthly report
        # One consolidated team digest, replacing 06_periodic_report.py's
        # per-BD loop (one email each, ~16 every run). Same metrics and
        # same table as the daily digest, over the month window.
        # --email-only: the daily run already wrote these days to
        # Airtable, and closed days are frozen, so re-pushing would be
        # a no-op at best.
        run: python scripts/bd_metrics_long.py --period monthly --email-only
        env:
          KYLAS_API_KEY:    ${{ secrets.KYLAS_API_KEY }}
          AIRTABLE_PAT:     ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
