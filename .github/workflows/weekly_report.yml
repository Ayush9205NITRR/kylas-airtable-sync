name: BD Weekly Report

on:
  # Scheduling is owned by cron-job.org's "BD Weekly" job (fires
  # workflow_dispatch at exactly 03:30 UTC / 9:00 AM IST Saturday). No native
  # `schedule:` here — GitHub's cron drifts late and was firing a SECOND run
  # (and a second email to the whole team) after cron-job.org's on-time one.
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly report
        run: python modules/06_periodic_report.py --period weekly
        env:
          AIRTABLE_PAT:     ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
